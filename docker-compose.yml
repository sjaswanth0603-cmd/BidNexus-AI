version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gem_pgvector_db
    environment:
      POSTGRES_USER: gem_user
      POSTGRES_PASSWORD: gem_password
      POSTGRES_DB: gem_bid_nexus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gem_user -d gem_bid_nexus"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: gem_fastapi_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://gem_user:gem_password@postgres:5432/gem_bid_nexus
      - SECRET_KEY=gem_bid_nexus_super_secret_key_sih26100_2026_production_key
      - LLM_PROVIDER=auto
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: gem_react_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
