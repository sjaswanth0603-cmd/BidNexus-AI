services:
  # FastAPI Backend Web Service
  - type: web
    name: bidnexus-ai-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PROJECT_NAME
        value: AI-Powered Integrated Bid Compliance Verification Platform
      - key: API_V1_STR
        value: /api/v1
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_DB_NAME
        value: bidnexus_ai
      - key: LLM_PROVIDER
        value: gemini
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "10000"
      - key: MONGODB_URL
        value: mongodb+srv://jaswanth:jaswanth@cluster0.okhihr5.mongodb.net/?appName=Cluster0
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
