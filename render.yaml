services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: bidnexus-ai-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        value: gem_bid_nexus_super_secret_key_sih26100_2026_production_key
      - key: MONGODB_URL
        value: mongodb+srv://hemanthreddyg444_db_user:ePUAe1UsJiGPpj9f@cluster0.t4ru2fh.mongodb.net/bidnexus_ai?retryWrites=true&w=majority
      - key: MONGODB_DB_NAME
        value: bidnexus_ai
      - key: LLM_PROVIDER
        value: auto

  # 2. React Vite Frontend Static Site
  - type: web
    name: bidnexus-ai-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://bidnexus-ai-backend.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://bidnexus-ai-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
